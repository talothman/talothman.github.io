# Blog settings
permalink: /blog/:title

# Site settings (SEO)
# `title` is also used as og:site_name, so it is the name Google associates with
# the whole domain. Keep it as the plain personal name; the descriptor lives in
# `tagline`, which jekyll-seo-tag appends to make "Talal Alothman | VR/AR/XR ...".
title: Talal Alothman
tagline: VR/AR/XR Developer & Researcher
description: >-
  Talal Alothman is a software developer and researcher specializing in
  VR, AR, XR, spatial user interfaces, and immersive technology.
  Exploring interaction design for virtual reality, augmented reality,
  and holographic displays.
lang: en

# Author (structured for SEO)
author:
  name: Talal Alothman
  url: https://talothman.github.io
  # Key must stay `twitter` -- it is jekyll-seo-tag's schema, not a display name.
  twitter: talalhalothman

# Social links (for Schema.org structured data)
social:
  name: Talal Alothman
  links:
    - https://x.com/talalhalothman
    - https://github.com/talothman
    - https://www.linkedin.com/in/talothman

# My variables (for templates)
name: Dispatches/أيفادات
eng-name: Dispatches
ara-name: إيفادات

# Default image for social sharing
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.png
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: Talal Alothman
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project

# File management
include: [".htaccess"]
exclude: ["README.md", "LICENSE", "CLAUDE.md", "Gemfile", "Gemfile.lock", "node_modules", "vendor"]

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Sass
sass:
  style: :compressed
  sass_dir: _sass

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge

# Card metadata for X. The `twitter` key and the twitter:card / twitter:site
# meta tags it emits keep their original names -- that is still the spec X
# reads, and renaming them would break link previews.
twitter:
  username: talalhalothman
  card: summary_large_image

# Sitemap
url: https://talothman.github.io

# Collections
collections:
  projects:
    output: true