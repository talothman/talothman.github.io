---
layout: default
---

<div class="post">
	<div class="post__back">
    	<a href="/">&lt;-- home</a>
    </div>
    <div class="post__title">
    	<h1>{{ page.title }}</h1>
    </div>
    <div class="post__date">
    	<p>By <span class="post__author">{{ page.author | default: site.author.name }}</span> &middot; {{ page.date | date: '%B %-d, %Y' }}</p>
    </div>
    {% if page.tags and page.tags != empty %}
    <div class="post__meta">
    	<p>{{ page.tags | join: ', ' }}</p>
    </div>
    {% endif %}
    <div class="post__content">
        {{ content }}
    </div>
</div>
