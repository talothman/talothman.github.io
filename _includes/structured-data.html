<!-- Person Schema.
     The @id gives the person a stable identifier that the WebSite/BlogPosting
     nodes below point at, so Google reads one linked entity instead of three
     unrelated blobs. `sameAs` is the strongest signal tying this domain to the
     same Talal Alothman as the GitHub/LinkedIn/X profiles. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.url }}/#person",
  "name": "{{ site.author.name }}",
  "url": "{{ site.url }}",
  "jobTitle": "VR/AR/XR Developer & Researcher",
  "description": "Software developer specializing in VR, AR, XR, and spatial user interfaces",
  "knowsAbout": ["Virtual Reality", "Augmented Reality", "XR", "Spatial Computing", "Interaction Design", "HoloLens", "Oculus", "Unity"],
  "sameAs": [
    {% for link in site.social.links %}"{{ link }}"{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>

<!-- Website Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ site.url }}/#website",
  "name": "{{ site.title }}",
  "alternateName": "{{ site.name }}",
  "url": "{{ site.url }}",
  "description": "{{ site.description | strip_newlines | strip }}",
  "inLanguage": "en",
  "author": { "@id": "{{ site.url }}/#person" },
  "publisher": { "@id": "{{ site.url }}/#person" },
  "about": { "@id": "{{ site.url }}/#person" }
}
</script>

{% if page.url == '/' %}
<!-- Marks the homepage as being *about* the person, which is what promotes the
     name query from "some blog" to a recognised entity. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "@id": "{{ site.url }}/#profilepage",
  "url": "{{ site.url }}",
  "name": "{{ site.title }}",
  "isPartOf": { "@id": "{{ site.url }}/#website" },
  "mainEntity": { "@id": "{{ site.url }}/#person" }
}
</script>
{% endif %}

{% if page.layout == 'post' %}
<!-- BlogPosting Schema for posts -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.description | default: page.excerpt | strip_html | truncate: 160 | escape }}",
  "author": { "@id": "{{ site.url }}/#person" },
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "isPartOf": { "@id": "{{ site.url }}/#website" },
  "publisher": { "@id": "{{ site.url }}/#person" }{% if page.image %},
  "image": "{{ page.image | absolute_url }}"{% endif %}{% if page.tags %},
  "keywords": "{{ page.tags | join: ', ' }}"{% endif %}
}
</script>
{% endif %}
